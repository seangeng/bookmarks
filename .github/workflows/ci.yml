name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs first and on its own: a failed export upload should fail the PR
      # with an obvious message rather than surface as a confusing build error.
      - name: Validate seed
        run: npm run check:seed

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
