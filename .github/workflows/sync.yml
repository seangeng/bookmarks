name: Sync bookmarks

# Push a fresh X export to data/bookmarks-seed.json and this job does the rest:
# crawl the new links, rebuild the index, and commit the artifacts. Vercel then
# deploys from the resulting commit.
on:
  push:
    paths:
      - "data/bookmarks-seed.json"
  workflow_dispatch:
    inputs:
      force_recrawl:
        description: "Re-crawl every link instead of only new ones"
        type: boolean
        default: false

concurrency:
  group: sync-bookmarks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Stop before crawling if the export upload produced a placeholder or
      # otherwise unusable file, so the committed artifacts are never rebuilt
      # from a broken seed.
      - name: Validate seed
        run: npm run check:seed

      - name: Crawl external links
        run: npm run crawl -- --max-age=30 --retry-failed ${{ inputs.force_recrawl && '--force' || '' }}
        env:
          CRAWL_CONCURRENCY: "5"
          CRAWL_TIMEOUT_MS: "10000"

      - name: Rebuild search index
        run: npm run index
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EMBEDDING_MODEL: ${{ vars.OPENAI_EMBEDDING_MODEL }}
          OPENAI_CHAT_MODEL: ${{ vars.OPENAI_CHAT_MODEL }}
          UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
          UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crawls data/index
          if git diff --cached --quiet; then
            echo "No crawl or index changes."
          else
            git commit -m "chore: refresh crawl artifacts and search index"
            git push
          fi
